<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bastion TD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Bastion TD</h1>
      <div class="actions">
        <button id="speed" class="btn btn-secondary" type="button" aria-label="Toggle game speed">1x</button>
        <button id="restart" class="btn btn-secondary" type="button">Restart</button>
        <button id="start" class="btn btn-primary" type="button">Start wave</button>
      </div>
    </header>
    <section id="hud" aria-label="Game status">
      <div class="stat"><span class="label">Gold</span><b id="gold">0</b></div>
      <div class="stat"><span class="label">Lives</span><b id="lives">0</b></div>
      <div class="stat"><span class="label">Wave</span><b id="wave">0</b></div>
      <div class="stat"><span class="label">Kills</span><b id="kills">0</b></div>
      <div class="stat wide"><span class="label">Status</span><b id="status" aria-live="polite">Ready</b></div>
    </section>
    <section id="build" aria-label="Build menu">
      <button id="pick-arrow" class="btn btn-secondary pick" type="button" aria-pressed="true">1 Arrow <span>50</span></button>
      <button id="pick-frost" class="btn btn-secondary pick" type="button" aria-pressed="false">2 Frost <span>70</span></button>
      <button id="pick-cannon" class="btn btn-secondary pick" type="button" aria-pressed="false">3 Cannon <span>100</span></button>
      <div id="selection" class="selection" hidden>
        <span id="sel-info">No tower selected</span>
        <button id="upgrade" class="btn btn-secondary" type="button">Upgrade</button>
        <button id="sell" class="btn btn-secondary" type="button">Sell</button>
      </div>
    </section>
    <canvas id="game" width="768" height="480"></canvas>
    <p class="hint">Pick a tower (<kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>) and click a free tile to build it; click a tower to upgrade or sell it. <kbd>Space</kbd> starts the next wave, <kbd>R</kbd> restarts. Calling a wave early pays 1 gold per second skipped.</p>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
